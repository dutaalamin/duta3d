<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0e527c" />
      <stop offset="100%" stop-color="#05121e" />
    </linearGradient>
    <linearGradient id="mark" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="100%" stop-color="#4ad9ff" />
    </linearGradient>
  </defs>

  <!-- Deep-water tile -->
  <rect width="64" height="64" rx="14" fill="url(#bg)" />

  <!-- Bubbles rising on the right -->
  <circle cx="47" cy="44" r="4.5" fill="none" stroke="#4ad9ff" stroke-width="2" opacity="0.75" />
  <circle cx="52" cy="31" r="2.8" fill="none" stroke="#7ce8ff" stroke-width="1.6" opacity="0.6" />
  <circle cx="45" cy="21" r="1.8" fill="#4ad9ff" opacity="0.55" />

  <!-- Letter D -->
  <path
    d="M14 15 h12 a17 17 0 0 1 0 34 h-12 z M22 22 v20 h4 a10 10 0 0 0 0-20 z"
    fill="url(#mark)"
    fill-rule="evenodd"
  />

  <!-- Water line under the mark -->
  <rect x="10" y="50" width="26" height="2.5" rx="1.25" fill="#4ad9ff" opacity="0.8" />
</svg>
